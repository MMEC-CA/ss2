<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REX DOWN!</title>
    <style>
        body { margin: 0; background: #080808; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; color: gold; font-family: 'Courier New', Courier, monospace; }
        #game-container { position: relative; border: 4px solid gold; box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); }
        canvas { background: #000; display: block; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; box-sizing: border-box; }
        .stats { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; text-shadow: 2px 2px #000; }
        #progress-container { width: 100%; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; margin-top: 5px; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #FFD700, #FF8C00); transition: width 0.1s; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: auto; }
        h1 { font-size: 48px; margin: 0; color: #FFD700; text-shadow: 0 0 10px #FFD700; }
        .credits { font-size: 12px; margin-top: 20px; color: #aaa; }
        .btn { margin-top: 20px; padding: 10px 20px; background: gold; color: black; font-weight: bold; cursor: pointer; border: none; font-family: inherit; font-size: 18px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="ui-layer">
            <div>
                <div class="stats">
                    <div id="levelDisplay">Level: 1</div>
                    <div id="percentDisplay">0%</div>
                </div>
                <div id="progress-container">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </div>
        
        <div id="start-screen" class="overlay">
            <h1>REX DOWN!</h1>
            <p>Use SPACE or UP to Jump/Fly</p>
            <p>Triple Jump enabled!</p>
            <button class="btn" onclick="startGame()">START GAME</button>
            <div class="credits">Credits: Sofia, Nyssa, Tang xin and Nour</div>
        </div>

        <div id="gameover-screen" class="overlay hidden">
            <h1 style="color: #ff4444;">REX DOWN!</h1>
            <p id="final-score">Level 1 - 0%</p>
            <button class="btn" onclick="startGame()">RETRY</button>
            <div class="credits">Credits: Sofia, Nyssa, Tang xin and Nour</div>
        </div>

        <div id="win-screen" class="overlay hidden">
            <h1 style="color: #44ff44;">CELEBRATION!</h1>
            <p>Level Complete!</p>
            <button class="btn" onclick="nextLevel()">NEXT LEVEL</button>
            <div class="credits">Credits: Sofia, Nyssa, Tang xin and Nour</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelDisplay = document.getElementById('levelDisplay');
        const percentDisplay = document.getElementById('percentDisplay');
        const progressBar = document.getElementById('progress-bar');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const winScreen = document.getElementById('win-screen');

        canvas.width = 800;
        canvas.height = 400;

        let gameState = 'START'; // START, PLAYING, GAMEOVER, WIN
        let frame = 0;
        let level = 1;
        let gameSpeed = 6;
        let progress = 0; // 0 to 100
        const levelLength = 2000; // frames to reach 100%

        const colors = {
            green: '#00FF00',
            purple: '#BF00FF',
            blue: '#0000FF',
            red: '#FF0000',
            orange: '#FF8C00',
            yellow: '#FFFF00',
            gold: '#FFD700'
        };

        const player = {
            x: 100, y: 300, w: 40, h: 46,
            dy: 0, gravity: 0.8, jumpForce: -13,
            jumpCount: 0,
            maxJumps: 3,
            mode: 'cube', // 'cube' or 'ship'
            rotation: 0
        };

        let obstacles = [];
        let particles = [];

        // Audio Setup
        let audioCtx;
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playJumpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playCrashSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        let bgMusicOsc;
        function playBGMusic() {
            if (!audioCtx) return;
            if (bgMusicOsc) return;
            // Simple loop logic could be complex, let's just do a sequence
            const sequence = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
            let noteIdx = 0;
            
            setInterval(() => {
                if (gameState !== 'PLAYING') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(sequence[noteIdx % sequence.length], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
                noteIdx++;
            }, 500);
        }

        // Input
        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                handleInput();
            }
        });

        canvas.addEventListener('mousedown', handleInput);

        function handleInput() {
            if (gameState === 'START') {
                startGame();
            } else if (gameState === 'PLAYING') {
                if (player.mode === 'cube') {
                    if (player.jumpCount < player.maxJumps) {
                        player.dy = player.jumpForce;
                        player.jumpCount++;
                        playJumpSound();
                    }
                } else {
                    player.dy -= 3.5;
                    if (player.dy < -9) player.dy = -9;
                }
            } else if (gameState === 'GAMEOVER') {
                startGame();
            }
        }

        function startGame() {
            initAudio();
            playBGMusic();
            gameState = 'PLAYING';
            frame = 0;
            progress = 0;
            player.y = 300;
            player.dy = 0;
            player.jumpCount = 0;
            player.mode = 'cube';
            obstacles = [];
            particles = [];
            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            winScreen.classList.add('hidden');
        }

        function nextLevel() {
            level++;
            gameSpeed += 0.5;
            startGame();
        }

        function spawnObstacle() {
            if (progress > 95) return; // Stop spawning near end

            const rand = Math.random();
            let obs = { x: canvas.width, passed: false };

            if (rand < 0.4) { // Pillar
                obs.type = 'pillar';
                obs.w = 50;
                obs.h = 80 + Math.random() * 120;
                obs.y = canvas.height - obs.h;
                obs.color = Object.values(colors)[Math.floor(Math.random() * Object.values(colors).length)];
                obs.details = Array.from({length: 5}, () => Math.random()); // Random patterns
            } else if (rand < 0.65) { // Spike
                obs.type = 'spike';
                obs.w = 35;
                obs.h = 35;
                obs.y = canvas.height - 35;
                obs.color = colors.red;
            } else if (rand < 0.85) { // Portal
                obs.type = 'portal';
                obs.w = 60;
                obs.h = 120;
                obs.y = 100 + Math.random() * 150;
                obs.targetMode = player.mode === 'cube' ? 'ship' : 'cube';
                obs.color = obs.targetMode === 'ship' ? colors.purple : colors.green;
            } else { // Speed Control Portal (Slower)
                obs.type = 'speedPortal';
                obs.w = 40;
                obs.h = 80;
                obs.y = 150 + Math.random() * 100;
                obs.color = colors.gold;
            }
            obstacles.push(obs);
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            frame++;
            progress = (frame / levelLength) * 100;
            if (progress > 100) progress = 100;

            percentDisplay.innerText = Math.floor(progress) + '%';
            progressBar.style.width = progress + '%';

            // Speed Cap / Slowdown logic
            if (gameSpeed > 12) gameSpeed = 12; // Cap speed
            
            if (progress >= 100 && obstacles.length === 0) {
                gameState = 'WIN';
                winScreen.classList.remove('hidden');
            }

            // Player physics
            if (player.mode === 'ship') {
                player.dy += 0.2; // Gravity in ship mode
            } else {
                player.dy += player.gravity;
            }
            player.y += player.dy;

            // Ground/Ceiling collision
            if (player.y + player.h > canvas.height) {
                player.y = canvas.height - player.h;
                player.dy = 0;
                player.jumpCount = 0;
                player.rotation = 0;
            }
            if (player.y < 0) {
                player.y = 0;
                player.dy = 0;
            }

            // Spawn obstacles
            const spawnRate = Math.max(25, 80 - (gameSpeed * 3) - (level * 2));
            if (frame % Math.floor(spawnRate) === 0) {
                spawnObstacle();
            }

            // Obstacles update
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= gameSpeed;

                // Collision
                if (player.x < obs.x + obs.w && player.x + player.w > obs.x &&
                    player.y < obs.y + obs.h && player.y + player.h > obs.y) {
                    
                    if (obs.type === 'portal') {
                        if (player.mode !== obs.targetMode) {
                            player.mode = obs.targetMode;
                            for(let j=0; j<15; j++) particles.push(new Particle(obs.x, obs.y + obs.h/2, obs.color));
                        }
                    } else if (obs.type === 'speedPortal') {
                        gameSpeed = Math.max(6, gameSpeed - 1); // Slow down
                        obstacles.splice(i, 1);
                        for(let j=0; j<15; j++) particles.push(new Particle(player.x, player.y, colors.gold));
                        continue;
                    } else {
                        gameOver();
                    }
                }

                if (obs.x + obs.w < 0) obstacles.splice(i, 1);
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            playCrashSound();
            document.getElementById('final-score').innerText = `Level ${level} - ${Math.floor(progress)}%`;
            gameoverScreen.classList.remove('hidden');
        }

        function draw() {
            // Background
            if (progress >= 95) {
                // Celebration background
                ctx.fillStyle = `hsla(${(frame * 2) % 360}, 60%, 20%, 1)`;
            } else {
                ctx.fillStyle = '#080808';
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Background (Grid)
            ctx.strokeStyle = progress >= 95 ? `hsla(${(frame * 5) % 360}, 100%, 50%, 0.3)` : '#222';
            ctx.lineWidth = 1;
            const scrollOffset = (frame * gameSpeed) % 50;
            for (let x = -scrollOffset; x < canvas.width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw Obstacles
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = obs.color;

                if (obs.type === 'spike') {
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.h);
                    ctx.lineTo(obs.x + obs.w / 2, obs.y);
                    ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
                    ctx.fill();
                    // Inner detail
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 10, obs.y + obs.h - 5);
                    ctx.lineTo(obs.x + obs.w / 2, obs.y + 10);
                    ctx.lineTo(obs.x + obs.w - 10, obs.y + obs.h - 5);
                    ctx.fill();
                } else if (obs.type === 'pillar') {
                    // Detailed Pillar
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1;
                    // Segments and Patterns
                    obs.details.forEach((d, i) => {
                        const dy = obs.y + (obs.h / 5) * i;
                        ctx.strokeRect(obs.x + 5, dy + 5, obs.w - 10, (obs.h / 5) - 10);
                        if (d > 0.5) {
                            ctx.beginPath(); ctx.moveTo(obs.x, dy); ctx.lineTo(obs.x + obs.w, dy + 20); ctx.stroke();
                        }
                    });
                } else if (obs.type === 'portal' || obs.type === 'speedPortal') {
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = obs.color;
                    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 12px Courier New';
                    const text = obs.type === 'speedPortal' ? 'SLOW' : obs.targetMode.toUpperCase();
                    ctx.fillText(text, obs.x + 5, obs.y + obs.h/2);
                }
                ctx.shadowBlur = 0;
            });

            // Draw Particles
            particles.forEach(p => p.draw());

            // Draw Player (Monster)
            drawMonster(player.x, player.y, player.w, player.h, player.mode === 'ship');
        }

        function drawMonster(x, y, w, h, isFlying) {
            ctx.save();
            ctx.translate(x + w / 2, y + h / 2);
            
            if (player.mode === 'cube' && player.dy !== 0) {
                player.rotation += 0.15;
                ctx.rotate(player.rotation);
            } else if (player.mode === 'ship') {
                ctx.rotate(player.dy * 0.05);
            }

            const bodyColor = isFlying ? colors.blue : colors.gold;
            ctx.fillStyle = bodyColor;
            
            // Body
            ctx.beginPath();
            ctx.roundRect(-w/2, -h/2, w, h, 8);
            ctx.fill();

            // Horns
            ctx.fillStyle = colors.red;
            ctx.beginPath();
            ctx.moveTo(-w/2 + 5, -h/2); ctx.lineTo(-w/2, -h/2 - 15); ctx.lineTo(-w/2 + 15, -h/2); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(w/2 - 15, -h/2); ctx.lineTo(w/2 - 5, -h/2 - 15); ctx.lineTo(w/2, -h/2); ctx.fill();

            // Tail
            ctx.strokeStyle = bodyColor;
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(-w/2, h/4);
            const tailWave = Math.sin(frame * 0.2) * 10;
            ctx.quadraticCurveTo(-w, h/2 + tailWave, -w/2 - 10, h/2);
            ctx.stroke();

            // Eye
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(w/4, -h/4, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(w/4 + 2, -h/4, 3, 0, Math.PI*2); ctx.fill();

            // Teeth
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.moveTo(w/4, h/4); ctx.lineTo(w/2, h/4); ctx.lineTo(w/4 + 5, h/2); ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(w/4 - 10, h/4); ctx.lineTo(w/2 - 10, h/4); ctx.lineTo(w/4 - 5, h/2); ctx.closePath(); ctx.fill();

            // Wings if flying
            if (isFlying) {
                ctx.fillStyle = colors.orange;
                const flap = Math.sin(frame * 0.4) * 20;
                // Back wing
                ctx.beginPath();
                ctx.moveTo(-w/4, 0);
                ctx.quadraticCurveTo(-w - 10, -h + flap, -w/4, -h/2);
                ctx.fill();
                // Front wing
                ctx.globalAlpha = 0.7;
                ctx.beginPath();
                ctx.moveTo(-w/4, 0);
                ctx.quadraticCurveTo(-w - 5, -h - flap, -w/4, -h/2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            ctx.restore();
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life;
                ctx.fillRect(this.x, this.y, 4, 4);
                ctx.globalAlpha = 1.0;
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
